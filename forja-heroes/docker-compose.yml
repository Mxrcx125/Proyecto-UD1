services:
  web:
    image: nginx:alpine
    container_name: forja_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - forja_network

  php:
    image: php:8.4-fpm-alpine
    container_name: forja_php
    volumes:
      - ./src:/var/www/html
      - ./php/forja.ini:/usr/local/etc/php/conf.d/zz-forja.ini:ro
    networks:
      - forja_network

networks:
  forja_network:
    driver: bridge
