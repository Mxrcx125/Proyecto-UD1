; =====================================================================
;  php/forja.ini · Directivas de TU entorno de desarrollo      [CE 2.f]
;  Se monta en /usr/local/etc/php/conf.d/zz-forja.ini
;  Tras modificarlo:  docker compose restart php
; =====================================================================

; R8.1 · display_errors: muestra errores en pantalla durante el desarrollo para depurar rápidamente
display_errors = On

; R8.2 · error_reporting: reporta absolutamente todos los errores y avisos de PHP (E_ALL = 32767)
error_reporting = E_ALL

; R8.3 · date.timezone: define la zona horaria del servidor para que date() refleje la hora local peninsular
date.timezone = Europe/Madrid

; R8.4 · short_open_tag: habilita las etiquetas cortas de salida <?= ... ?> requeridas en la plantilla HTML
short_open_tag = On

; R8.5 · expose_php: desactiva la cabecera HTTP X-Powered-By para no divulgar la versión de PHP por seguridad
expose_php = Off

; R8.6 · max_execution_time: limita a 10 segundos el tiempo de ejecución para evitar procesos colgados en el servidor
max_execution_time = 10
